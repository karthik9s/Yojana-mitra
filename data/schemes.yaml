- id: ntr_bharosa_chronic_illness
  name: "NTR Bharosa Pension – Chronic Illness (Dialysis, Thalassemia, etc.)"
  name_te: "ఎన్టీఆర్ భరోసా పింఛను – దీర్ఘకాలిక వ్యాధిగ్రస్తులు"
