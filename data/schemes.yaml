    - use: ap_resident
    - {field: health_conditions, op: any_in, values: [kidney_dialysis, thalassemia, sickle_cell, haemophilia, bedridden], label: "Listed chronic illness (dialysis, thalassemia, sickle-cell, haemophilia, bed-ridden)"}
    - use: ap_welfare_standard

