  level: state
  category: pension
  department: "Department of Rural Development (SERP) / Health Dept., Govt. of Andhra Pradesh"
  amount: "₹10,000 per month"
  summary: "Health pension for patients on dialysis (CKD/CKDU), thalassemia, sickle-cell, severe haemophilia and similar conditions."
  benefits:
    - "₹10,000 per month for patients with chronic kidney disease on dialysis, CKDU, thalassemia, sickle-cell anaemia, severe haemophilia and similar listed conditions."
    - "₹15,000 per month for bed-ridden / fully paralysed patients."
  documents:
    - "Aadhaar card"
    - "Medical certificate from a government or network hospital (dialysis record, diagnosis)"
    - "GSWS household database entry"
  how_to_apply:
    - "Get the diagnosis certified at the treating government / Dr. NTR Vaidya Seva network hospital."
    - "Apply at the Village / Ward Secretariat with the medical records."
  portal: "https://sspensions.ap.gov.in"
