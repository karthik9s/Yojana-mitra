  name_te: "ఎన్టీఆర్ భరోసా పింఛను – వితంతు"
  name_hi: "एनटीआर भरोसा पेंशन – विधवा"
  level: state
  category: pension
  department: "Department of Rural Development (SERP), Govt. of Andhra Pradesh"
  amount: "₹4,000 per month"
  summary: "Monthly pension for widows from poor households in Andhra Pradesh."
  benefits:
    - "₹4,000 per month, paid at the doorstep on the 1st of every month."
    - "When a pensioner husband dies, the wife can be shifted to the widow pension from the next month (spouse category)."
  documents:
    - "Aadhaar card"
    - "Husband's death certificate"
    - "Rice card / GSWS household database entry"
    - "Bank account details"
  how_to_apply:
    - "Apply at your Village / Ward Secretariat with the husband's death certificate."
    - "The secretariat verifies through e-KYC and the six-step validation."
    - "Track status on sspensions.ap.gov.in."
  portal: "https://sspensions.ap.gov.in"
  sources:
    - "https://sspensions.ap.gov.in/SSP/Documents/GO%20MS%2043%2013.06.2024.pdf"
    - "https://www.outlookmoney.com/retirement/pension/ntr-bharosa-pension-scheme-what-is-it-eligibility-and-documents-required"
  status_note: "Applications are taken in notified windows; spouse-category transfers are processed monthly."
  details: >
    Widows aged 18 and above are eligible for the NTR Bharosa widow pension if the household
    clears the six-step validation (income, land, electricity, vehicle, government employment
    and income-tax checks). A death certificate of the husband is mandatory.
