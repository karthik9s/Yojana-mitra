# Yojana Mitra - curated scheme knowledge base for Andhra Pradesh residents.
#
# Every scheme becomes a (:Scheme) node. Every criterion becomes a shared (:Criterion)
# node, linked by [:REQUIRES {group}] edges. Criteria in the same `any_of` block share a
# group and are OR-ed; different groups are AND-ed (conjunctive normal form).
#
# Criterion keys:
#   field   profile field (see yojana_mitra/profile.py; derived fields are computed there)
#   op      eq | in | gte | lte | is_true | is_false | any_in
#   value / values
#   assume  true -> if the citizen did not mention it, assume the usual case and show it
#           as a "please confirm" condition instead of blocking the match
#   label   human-readable condition shown to the user
#
# `use: <macro>` expands a reusable bundle of criteria (see `macros`).
#
# Facts were compiled from official portals and news coverage up to Nov 2026. Amounts and
# rules change; every scheme lists its sources and the UI tells users to verify there.

version: "2026-11"
last_reviewed: "2026-11-18"

macros:
  ap_resident:
    - {field: ap_resident, op: is_true, label: "Resident of Andhra Pradesh"}
  ap_welfare_standard:
    # The common "six-step validation" used by AP welfare schemes (rice-card style limits).
    - {field: income_within_ap_limit, op: is_true, label: "Household income within ₹10,000/month (rural) or ₹12,000/month (urban)"}
    - {field: land_within_ap_limit, op: is_true, label: "Land below 3 acres wet / 10 acres dry"}
    - {field: govt_employee, op: is_false, assume: true, label: "No government employee or pensioner in the family"}
    - {field: income_tax_payer, op: is_false, assume: true, label: "Not an income-tax payer"}
    - {field: owns_four_wheeler, op: is_false, assume: true, label: "No private four-wheeler (taxi/tractor/auto exempt)"}
  central_basic_exclusions:
    - {field: govt_employee, op: is_false, assume: true, label: "Not a government employee"}
    - {field: income_tax_payer, op: is_false, assume: true, label: "Not an income-tax payer"}

schemes:

# ----------------------------------------------------------------------------------
# ANDHRA PRADESH - NTR Bharosa social security pensions (one node per category)
# ----------------------------------------------------------------------------------
- id: ntr_bharosa_old_age
  name: "NTR Bharosa Pension – Old Age"
  name_te: "ఎన్టీఆర్ భరోసా పింఛను – వృద్ధాప్య"
  name_hi: "एनटीआर भरोसा पेंशन – वृद्धावस्था"
  level: state
  category: pension
  department: "Department of Rural Development (SERP), Govt. of Andhra Pradesh"
  amount: "₹4,000 per month"
  summary: "Monthly social security pension for poor elderly citizens of Andhra Pradesh."
  benefits:
    - "₹4,000 per month, delivered to the doorstep by village/ward secretariat staff on the 1st of every month."
    - "Raised from ₹3,000 to ₹4,000 by G.O.Ms.No.43 (13 June 2024), effective 1 July 2024."
  documents:
    - "Aadhaar card"
    - "Rice card / household listed in the GSWS household database"
    - "Age proof (Aadhaar, birth certificate or school record)"
    - "Bank account or Aadhaar-linked payment details"
    - "Passport-size photograph"
  how_to_apply:
    - "Visit your Village / Ward Secretariat (Swarna Gramam / Swarna Ward centre) when the application window is open."
    - "The Welfare & Education Assistant or Ward Welfare Secretary registers the application with e-KYC."
    - "Eligibility is checked against the six-step validation; sanctioned pensions are released in phases."
    - "Track status on sspensions.ap.gov.in."
  portal: "https://sspensions.ap.gov.in"
  sources:
    - "https://sspensions.ap.gov.in/SSP/Documents/GO%20MS%2043%2013.06.2024.pdf"
    - "https://sspensions.ap.gov.in/ssp/home/about"
  status_note: "Fresh applications are accepted only during notified windows (e.g. 7–16 Sept 2026)."
  details: >
    NTR Bharosa replaced YSR Pension Kanuka in June 2024. The old-age category covers men and
    women aged 60 and above from poor households. Households must clear the six-step validation:
    monthly household income up to ₹10,000 in rural areas and ₹12,000 in urban areas, land below
    3 acres wet or 10 acres dry (or 10 acres combined), monthly electricity use below 300 units,
    no government employee or government pensioner in the family, no four-wheeler (taxis,
    tractors and autos are exempt), no income-tax payer, and urban property below 1,000 sq ft.
    Only one pension is allowed per person.
  criteria:
    - use: ap_resident
    - {field: age, op: gte, value: 60, label: "Age 60 years or above"}
    - use: ap_welfare_standard

- id: ntr_bharosa_widow
