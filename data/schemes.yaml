    - "https://sspensions.ap.gov.in/SSP/Documents/GO%20MS%2043%2013.06.2024.pdf"
  status_note: "Disability percentage is verified through SADAREM; re-verification drives happen periodically."
  details: >
    Persons with disabilities of any age with 40% or more disability certified by SADAREM are
