- id: ntr_bharosa_disabled
  name: "NTR Bharosa Pension – Persons with Disabilities"
  name_te: "ఎన్టీఆర్ భరోసా పింఛను – దివ్యాంగులు"
  name_hi: "एनटीआर भरोसा पेंशन – दिव्यांग"
  level: state
  category: pension
  department: "Department of Rural Development (SERP), Govt. of Andhra Pradesh"
  amount: "₹6,000 per month (₹15,000 for fully disabled / bed-ridden)"
  summary: "Monthly pension for persons with 40% or more disability."
  benefits:
    - "₹6,000 per month for persons with 40% or more disability."
    - "₹15,000 per month for persons who are fully disabled, bed-ridden, or have severe paralysis."
  documents:
    - "Aadhaar card"
    - "SADAREM disability certificate showing 40% or more disability"
    - "Rice card / GSWS household database entry"
    - "Bank account details"
  how_to_apply:
    - "Obtain a SADAREM certificate from the designated government hospital camp."
    - "Apply at the Village / Ward Secretariat with the certificate."
    - "Track status on sspensions.ap.gov.in."
  portal: "https://sspensions.ap.gov.in"
