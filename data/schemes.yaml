    Health pensions cover people with serious chronic conditions: chronic kidney disease on
    dialysis, CKDU (stages 3–5), thalassemia, sickle-cell disease, severe haemophilia and similar
    listed conditions receive ₹10,000 per month; bed-ridden and fully paralysed patients receive
    ₹15,000 per month.
