  name_hi: "एनटीआर भरोसा पेंशन – एकल महिला"
  level: state
  category: pension
  department: "Department of Rural Development (SERP), Govt. of Andhra Pradesh"
  amount: "₹4,000 per month"
  summary: "Monthly pension for unmarried, divorced, separated or deserted women from poor households."
  benefits:
    - "₹4,000 per month at the doorstep."
  documents:
    - "Aadhaar card"
    - "Proof of separation / divorce decree or certificate from the village/ward secretariat (as applicable)"
    - "Rice card / GSWS household database entry"
    - "Bank account details"
  how_to_apply:
    - "Apply at the Village / Ward Secretariat during the notified application window."
    - "Track status on sspensions.ap.gov.in."
  portal: "https://sspensions.ap.gov.in"
  sources:
    - "https://sspensions.ap.gov.in/ssp/home/about"
