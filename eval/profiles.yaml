# 50 synthetic citizen profiles with hand-labelled eligible schemes.
#
# Labelling convention (applied by hand, scheme by scheme, from data/schemes.yaml rules):
#  * A scheme is labelled eligible only if the facts STATED in the text satisfy all its rules.
#  * Standard exclusions the person doesn't mention (govt employee, income-tax payer, car owner,
#    own vehicle for auto drivers) are taken as not applying - the app shows them as "please
#    confirm" conditions.
#  * Facts not stated are not assumed (no LPG mentioned -> not Deepam; no house info -> not PMAY).
#  * Gender is never inferred from a name; texts state it where it matters.
#  * Situational schemes count only when the situation is stated (pregnancy, disability...).
#  * "profile" holds the gold values of key fields, used to score extraction field accuracy.

