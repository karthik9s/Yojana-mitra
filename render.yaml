# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: yojana-mitra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn yojana_mitra.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: YM_DENSE
        value: "off"
      - key: YM_LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false   # Render asks you for the value; it is never stored in the repo
