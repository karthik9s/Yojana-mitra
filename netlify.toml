# Netlify: serve the static showcase page in docs/.
# base = "docs" keeps Netlify away from the root requirements.txt (the Python app),
# so it doesn't try to install PyTorch etc. Paths below are relative to base.
[build]
  base = "docs"
  publish = "."
  command = "echo 'static site, no build'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
